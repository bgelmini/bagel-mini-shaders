<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bagel-mini comparisons</title>
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --card:#151b23; --line:#3d444d; --accent:#4493f8; --accent-bg:#1f6feb; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --card:#f6f8fa; --line:#d1d9e0; --accent:#0969da; --accent-bg:#0969da; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:2rem; font-weight:600; margin:0 0 8px; padding-bottom:.3em; border-bottom:1px solid var(--line); }
  h2 { font-size:1.5rem; font-weight:600; margin:32px 0 4px; padding-bottom:.3em; border-bottom:1px solid var(--line); }
  p { color:var(--muted); margin:4px 0 16px; }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  kbd { font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; padding:2px 6px; border:1px solid var(--line); border-radius:6px; background:var(--card); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  figure button { all:unset; display:block; width:100%; cursor:zoom-in; }
  figure button:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  figure img { display:block; width:100%; height:auto; background:#000; }
  figcaption { padding:8px 10px; font-size:.9rem; }
  dialog { border:0; padding:0; background:transparent; max-width:100vw; max-height:100vh; width:100vw; height:100vh; }
  dialog::backdrop { background:rgba(0,0,0,.92); }
  .lb { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:12px; color:#eee; }
  .lb img { max-width:100%; max-height:calc(100vh - 110px); object-fit:contain; background:#000; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:center; margin-top:10px; font-size:.95rem; }
  .bar button { all:unset; cursor:pointer; padding:5px 14px; border:1px solid #3d444d; border-radius:6px; background:#212830; color:#e6edf3; font-size:14px; }
  .bar button:hover { background:#262c36; border-color:#656c76; }
  .bar button:focus-visible { outline:2px solid #4493f8; outline-offset:1px; }
  .bar button[aria-pressed="true"] { background:#1f6feb; border-color:#388bfd; color:#fff; }
  .bar span { min-width:200px; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>bagel-mini comparisons</h1>
  <p>Click a picture to open it full size. Inside the viewer, use ← → to move between presets of the same game, and the <b>Raw</b> button (or <kbd>R</kbd>) to flip to the unfiltered picture. <kbd>Esc</kbd> closes. <a href="https://github.com/bgelmini/bagel-mini-shaders">Back to the repo</a></p>
  <div id="sets"></div>
</main>

<dialog id="lb" aria-label="Full size picture">
  <div class="lb">
    <img id="lbimg" alt="">
    <div class="bar">
      <button id="prev" aria-label="Previous">←</button>
      <span id="cap"></span>
      <button id="next" aria-label="Next">→</button>
      <button id="rawbtn" aria-pressed="false">Raw</button>
      <button id="close">Close</button>
    </div>
  </div>
</dialog>

<script>
const CRT = "Screenshots/bagel-CRT-mini Comparisons/";
const LCD = "Screenshots/bagel-LCD-mini Comparisons/";
const SETS = [
  { title: "CRT, Mega Drive", note: "640x480", raw: CRT + "640x480Raw.png", items: [
    ["bagel-CRT-mini", CRT + "640x480CRT.png"],
    ["bagel-CRT-mini-GoodDither", CRT + "640x480GoodDither.png"],
    ["bagel-CRT-mini-Composite", CRT + "640x480Composite.png"],
    ["bagel-CRT-mini-RF", CRT + "640x480RF.png"],
    ["bagel-CRT-mini-BadRF", CRT + "640x480BadRF.png"] ] },
  { title: "LCD, Game Boy Color", note: "1280x720", raw: LCD + "1280x720GBC-Raw.png", items: [
    ["bagel-LCD-mini-Background", LCD + "1280x720GBC-Background.png"],
    ["bagel-LCD-mini-BadDisplay", LCD + "1280x720-GBC-BadLCD.png"] ] },
  { title: "LCD, Game Boy Advance", note: "720x480", raw: LCD + "720x480GBA-Raw.png", items: [
    ["bagel-LCD-mini", LCD + "720x480GBA-LCD.png"],
    ["bagel-LCD-mini-FakeGhost", LCD + "720x480GBA-FakeGhost.png"] ] },
];

const enc = p => p.split("/").map(encodeURIComponent).join("/");
const root = document.getElementById("sets");
const lb = document.getElementById("lb"), lbimg = document.getElementById("lbimg");
const cap = document.getElementById("cap"), rawbtn = document.getElementById("rawbtn");
let cur = { set: null, i: 0, raw: false };

function show() {
  const s = SETS[cur.set];
  const list = [["Raw (no shader)", s.raw]].concat(s.items);
  const e = list[cur.i];
  // when "raw" is held on, show the unfiltered picture but keep the position
  const showRaw = cur.raw && cur.i !== 0;
  lbimg.src = enc(showRaw ? s.raw : e[1]);
  lbimg.alt = e[0];
  cap.textContent = (showRaw ? "Raw (no shader), instead of " : "") + e[0] + "  (" + (cur.i + 1) + "/" + list.length + ")";
  rawbtn.setAttribute("aria-pressed", String(cur.raw));
}
function open(set, i) { cur = { set, i, raw: false }; show(); if (!lb.open) lb.showModal(); }
function step(d) { const n = SETS[cur.set].items.length + 1; cur.i = (cur.i + d + n) % n; cur.raw = false; show(); }

SETS.forEach((s, si) => {
  const h = document.createElement("h2"); h.textContent = s.title;
  const p = document.createElement("p"); p.textContent = s.note + ". The first picture is the raw game.";
  const g = document.createElement("div"); g.className = "grid";
  [["Raw (no shader)", s.raw]].concat(s.items).forEach((e, i) => {
    const f = document.createElement("figure");
    const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", "Open " + e[0]);
    const im = document.createElement("img"); im.src = enc(e[1]); im.alt = e[0]; im.loading = "lazy";
    b.appendChild(im); b.onclick = () => open(si, i);
    const c = document.createElement("figcaption"); c.textContent = e[0];
    f.append(b, c); g.appendChild(f);
  });
  root.append(h, p, g);
});

document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("close").onclick = () => lb.close();
rawbtn.onclick = () => { cur.raw = !cur.raw; show(); };
lb.addEventListener("click", e => { if (e.target === lb || e.target.classList.contains("lb")) lb.close(); });
document.addEventListener("keydown", e => {
  if (!lb.open) return;
  if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "r" || e.key === "R") { cur.raw = !cur.raw; show(); }
});
</script>
</body>
</html>
